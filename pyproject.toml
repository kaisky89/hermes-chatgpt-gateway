[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-chatgpt-gateway"
version = "0.1.0"
description = "A small MCP adapter for the Hermes Gateway Runs API"
requires-python = ">=3.9"

[project.scripts]
hermes-gateway-mcp = "hermes_gateway_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_gateway_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
